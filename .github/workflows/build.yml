name: Build ImmortalWrt

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y build-essential clang flex bison g++ gawk \
          gettext libncurses-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget

    - name: Clone ImmortalWrt
      run: |
        git clone https://github.com/immortalwrt/immortalwrt.git source
        cd source
        git checkout 2024.04.18
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Copy custom files
      run: |
        cp .config source/.config
        cp -r files source/files

    - name: Build firmware
      run: |
        cd source
        make defconfig
        make -j$(nproc) V=s

    - name: Upload firmware
      uses: actions/upload-artifact@v4
      with:
        name: firmware
        path: source/bin/targets/
